version: 2
# cooldown: a new version is proposed only 7 days after its release. Compromised releases of actions and packages
# were found and withdrawn within hours or days so far; the wait keeps them out, also with the automerge of
# .github/workflows/dependabot-automerge.yaml.
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Maintain the frontend dependencies (Sass, Bootstrap, Bootstrap icons)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Maintain the Python packages: Dependabot updates requirements/*.in where a version is pinned there
  # and recompiles base.txt/dev.txt with pip-compile.
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # minor and patch updates in one PR per week, major updates one PR each
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Maintain the base image in the Dockerfile. Only patch updates (3.14.x): a new Python minor version
  # is switched to deliberately, together with recompiling the requirements.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
