# Local test of the image with the database on the host (see README.md, Development).
services:
  web:
    network_mode: "host"
    build:
      context: .
    environment:
      - DATABASE_URL=postgres://oidc_demo:oidc_demo@localhost:5432/oidc_demo
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a long random value}
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - DJANGO_SUPERUSER_PASSWORD=admin
      - DJANGO_MIGRATE=on
      - DJANGO_CREATE_SUPERUSER=on
      - DJANGO_LOAD_INITIAL_DATA=on
